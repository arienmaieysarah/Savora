
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Savora | Sign In</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="brand-name">Savora</div>

            <p class="brand-tagline">
                DISCOVER. ORGANIZE. COOK.
            </p>

            <h1>Welcome Back</h1>

            <p class="welcome-text">
                Sign in to discover your favourite recipes.
            </p>

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="mb-3 text-start">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3 text-start">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>
                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="btn login-button w-100">
                    Sign In
                </button>

            </form>

            <p class="login-footer">
                Your kitchen, your recipes, your story.
            </p>

        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Authentication JS -->
    <script src="./js/auth.js"></script>

</body>
</html>
